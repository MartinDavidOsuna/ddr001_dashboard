name: Construction UI validation

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for mock-only responsive E2E
        run: npx playwright-core install chromium
      - name: Build isolated mock browser artifact
        run: npm run build -- --outDir=.artifacts/mock-ui
        env:
          VITE_CONSTRUCTION_DATA_MODE: mock
          VITE_API_BASE_URL: /api/v1
      - name: Start local production preview
        run: |
          npx vite preview --outDir=.artifacts/mock-ui --host 127.0.0.1 --port 4173 > /tmp/ddr001-vite.log 2>&1 &
          echo $! > /tmp/ddr001-vite.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/dashboard > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ddr001-vite.log
          exit 1
      - name: Run Construction mock-only responsive E2E
        env:
          E2E_APP_URL: http://127.0.0.1:4173
          E2E_ARTIFACTS_DIR: .artifacts/construction-ui
        run: npm run e2e:construction-ui
      - name: Run administration responsive E2E
        run: npm run e2e:administration-ui
      - name: Run diagnostics responsive E2E
        run: npm run e2e:functional-diagnostics-ui
      - name: Run global map offline responsive E2E
        run: npm run e2e:global-map
      - name: Upload responsive captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-ui-responsive
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local preview
        if: always()
        run: |
          if [ -f /tmp/ddr001-vite.pid ]; then
            kill "$(cat /tmp/ddr001-vite.pid)" || true
          fi
